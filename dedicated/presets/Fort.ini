[Server]
; Выделенный сервер GPK_MP: Fort. Строки с ; - пояснения, их можно удалить.

; 1 = эта папка - выделенный сервер (без игрока, без меню)
Enabled = 1
; имя сервера в списке (мастер-сервер, LAN)
Name = GPK_MP_Fort
; UDP-порт сервера (29020..29039 видны во вкладке LAN); у каждого сервера свой
Port = 29023
; deathmatch | tdm | convoy | fort | land
Mode = fort
; пароль входа (пусто = без пароля)
Password = 
; пароль админ-панели (пусто = админов нет)
AdminPassword = 1234
; игроков максимум (2..32)
MaxPlayers = 32
; море: random | opensea | ID острова (Barbados, Jamaica, ...)
Island = random
; random | ID погоды (11 Hour, 14 Hour, 19 Hour, Storm01, ...)
Weather = random
; 1 = корабль / герой возвращается после гибели
Respawn = 0
; минут на раунд (0 = без ограничения)
TimeLimit = 20
; ускорение: 0.5 / 0.75 / 1 / 2 ... 8
GameSpeed = 1
; 1 = можно войти (и переподключиться) в идущую игру
LateJoin = 0
; 0 близко, 1 средне, 2 далеко
StartPosition = 0
; денег на старте (1000..1000000)
Credit = 1000000
; самый большой класс кораблей (1 = все)
MaxShipClass = 1
; боты: 0 безобидные, 1 лёгкие, 2 средние, 3 тяжёлые
BotSkill = 3
; 1 = быстрый абордаж (расчётом), 0 = бой на палубе
FastBoarding = 0
; 1 = пистолеты перезаряжаются в бою
PistolReload = 0
; 1 = абордаж выключен (на суше: только холодное оружие)
NoBoarding = 0
; 1 = все пассивные морские перки
PassivePerks = 0
; 1 = активные морские перки
ActivePerks = 0
; 1 = регистрироваться на мастер-сервере (вкладка Интернет)
Internet = 1
; 1 = отвечать во вкладке LAN
Lan = 1
; 1 = пробивать NAT через мастер-сервер (если порт не проброшен)
P2P = 0
; с какого числа игроков в лобби начинается отсчёт до старта
MinPlayers = 2
; секунд отсчёта до старта (у всех «Готов» - 5 с)
StartDelay = 30
; секунд после конца раунда до возврата в лобби
RoundEndDelay = 20
; 1 = новая случайная карта каждый раунд (если random)
RotateMap = 1
; 1 = все вышли - игра закрывается, запуск поднимает её заново
QuitWhenEmpty = 1
; кадров в секунду сервера = как часто игроки получают положение кораблей (60 = плавно; 30 = рывками, но меньше нагрузка)
MaxFps = 60
; 0 = ничего не рисовать (VPS без видеокарты), 1 = рисовать
Render = 0
